<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>페이지 준비중</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 500px;
    }

    h1 {
      color: #333;
      font-size: 22px;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.5;
    }

    .email {
      margin-top: 15px;
      font-weight: bold;
      color: #2c7be5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>이 페이지는 아직 제작중이에요</h1>
    <p>나중에 다시 찾아오세요!</p>
    <p class="email">관리자 이메일 : dev.ezgg@gmail.com</p>
  </div>
</body>
</html>
